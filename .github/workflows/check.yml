name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goto_test
          POSTGRES_USER: goto
          POSTGRES_PASSWORD: goto-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goto -d goto_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOTO_TEST_POSTGRES_DSN: postgresql://goto:goto-test@localhost:5432/goto_test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: uv sync --frozen
      - name: Check Python application against PostgreSQL
        run: ./scripts/check.sh
      - run: uv build
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goto_test
          POSTGRES_USER: goto
          POSTGRES_PASSWORD: goto-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goto -d goto_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOTO_TEST_POSTGRES_DSN: postgresql://goto:goto-test@localhost:5432/goto_test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Test browser flows against PostgreSQL
        run: ./scripts/test-browser.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t goto:test .
