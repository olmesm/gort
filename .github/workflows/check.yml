name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gort
          POSTGRES_USER: gort
          POSTGRES_PASSWORD: gort-test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gort"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - name: Test with race detector
        env:
          GORT_TEST_POSTGRES_DSN: ${{ matrix.database == 'postgres' && 'postgres://gort:gort-test@localhost:5432/gort?sslmode=disable' || '' }}
        run: go test -race ./...
      - name: Check reachable vulnerabilities
        if: matrix.database == 'sqlite'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
