name: release

# Two ways to cut a release:
#   1. push a tag:   git tag v1.2.3 && git push origin v1.2.3
#   2. Actions tab → release → "Run workflow" with version=v1.2.3, which tags
#      the chosen ref itself and then releases it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release (e.g. v1.2.3)"
        required: true
        type: string
      notes_only:
        description: "Only refresh the notes of an existing release from CHANGELOG.md"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: goto_test
          POSTGRES_USER: goto
          POSTGRES_PASSWORD: goto-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goto -d goto_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOTO_TEST_POSTGRES_DSN: postgresql://goto:goto-test@localhost:5432/goto_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release notes are the CHANGELOG.md section for this version; a
      # missing section fails the run so nothing ships undocumented.
      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: ./scripts/release.sh notes

      - name: Refresh the notes of the existing release
        if: inputs.notes_only == true
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh refresh-notes

      - name: Tag the release (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.notes_only != true
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh tag

      - uses: jdx/mise-action@v4
        if: inputs.notes_only != true

      - name: Test
        if: inputs.notes_only != true
        run: |
          uv sync --frozen
          ./scripts/check.sh

      - name: Build Python distribution
        if: inputs.notes_only != true
        run: uv build

      - name: Publish release artifacts
        if: inputs.notes_only != true
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh publish
