name: release

# Two ways to cut a release:
#   1. push a tag:   git tag v1.2.3 && git push origin v1.2.3
#   2. Actions tab → release → "Run workflow" with version=v1.2.3, which tags
#      the chosen ref itself and then releases it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release (e.g. v1.2.3)"
        required: true
        type: string
      notes_only:
        description: "Only refresh the notes of an existing release from CHANGELOG.md"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gort_test
          POSTGRES_USER: gort
          POSTGRES_PASSWORD: gort-test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gort -d gort_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GORT_TEST_POSTGRES_DSN: postgresql://gort:gort-test@localhost:5432/gort_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The release notes are the CHANGELOG.md section for this version; a
      # missing section fails the run so nothing ships undocumented.
      - name: Extract release notes
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## / {f=0} f' CHANGELOG.md > "$NOTES"
          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          cat "$NOTES"

      - name: Refresh the notes of the existing release
        if: inputs.notes_only == true
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Tag the release (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.notes_only != true
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v1.2.3 (got '$VERSION')" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag left behind by a failed attempt (no release published for
          # it) is moved to this commit; a tag that has a release is final.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "$VERSION already has a published release" >&2
              exit 1
            fi
            echo "tag $VERSION exists from an unpublished attempt; re-tagging HEAD"
            git push --delete origin "refs/tags/$VERSION"
          fi
          git tag -d "$VERSION" 2>/dev/null || true   # the checkout fetched it too
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"

      - uses: astral-sh/setup-uv@v6
        if: inputs.notes_only != true
        with:
          python-version: '3.12'

      - name: Test
        if: inputs.notes_only != true
        run: |
          uv sync --frozen
          make check

      - name: Build Python distribution
        if: inputs.notes_only != true
        run: uv build

      - name: Publish release artifacts
        if: inputs.notes_only != true
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/checksums.txt
          gh release create "$VERSION" dist/*.whl dist/*.tar.gz dist/checksums.txt --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
