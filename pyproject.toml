[project]
name = "goto"
version = "0.3.0"
description = "Self-hosted URL shortener with a server-rendered dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlmodel>=0.0.22,<0.1",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18,<1",
  "bcrypt>=4.2,<6",
  "authlib>=1.3,<2",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "graphql-core>=3.2,<3.3",
  "psycopg[binary]>=3.2,<4",
  "qrcode[pil]>=8,<9",
  "user-agents>=2.2,<3",
]

[project.scripts]
goto = "goto.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<0.12"]

[tool.uv]
python-preference = "only-system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goto"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "goto/migrations"
"alembic.ini" = "goto/alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
