# Release builds: one static binary per OS/arch, no CGO (both the SQLite and
# Postgres drivers are pure Go). Triggered by .github/workflows/release.yml.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gort
    main: ./cmd/gort
    binary: gort
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: gort
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Release notes come from CHANGELOG.md, passed by the workflow as
# --release-notes, which replaces this generated changelog. (Do not set
# changelog.disable: that skips the stage before the file is read.)
changelog:
  use: git
  sort: asc

release:
  github:
    owner: olmesm
    name: gort
  draft: false
  prerelease: auto
