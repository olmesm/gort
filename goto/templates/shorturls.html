{% extends "layout.html" %}
{% block content %}
{% with data1=d.Data %}
<h1>Short URLs</h1>
<div class="toolbar shorturl-toolbar">
  <form class="shorturl-filters" hx-get="/admin/short-urls" hx-target="#su-table" hx-swap="outerHTML" hx-trigger="submit, input delay:400ms from:input[name='search'], change from:select" hx-push-url="true" method="get" action="/admin/short-urls">
    <input type="search" name="search" value="{{ data1.Search }}" aria-label="Search short URLs" placeholder="Search short code, URL, title or tag…">
    <select name="tag" aria-label="Tag">
      <option value="">All tags</option>
      {% for item2 in data1.TagOptions %}
      <option value="{{ item2.Value }}"{% if item2.Selected %} selected{% endif %}>{{ item2.Value }}</option>
      {% endfor %}
    </select>
    <select name="group" aria-label="Group">
      <option value="">All groups</option>
      {% for item3 in data1.GroupOptions %}
      <option value="{{ item3.Value }}"{% if item3.Selected %} selected{% endif %}>{{ item3.Value }}</option>
      {% endfor %}
    </select>
    <button class="secondary">Filter</button>
    <a href="/admin/short-urls">Clear filters</a>
  </form>
  <a class="btn" href="/admin/short-urls/new">+ New short URL</a>
</div>
{% with d=data1.Table, root=data1.Table %}{% include "su-table.html" %}{% endwith %}
{% endwith %}
{% endblock %}
