
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ d.Title }} · Goto</title>
  <link rel="preload" href="/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <script src="/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin" aria-label="Goto home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 13h13l-5-5 4-4 12 12-12 12-4-4 5-5H5z"/></svg><span>goto<span class="brand-dot">.</span></span></a>
    <nav aria-label="Main navigation">
      <a href="/admin"{% if active(d.Path, "/admin") %} class="active"{% endif %}>Overview</a>
      <a href="/admin/short-urls"{% if active(d.Path, "/admin/short-urls") %} class="active"{% endif %}>Short URLs</a>
      {% if d.User.IsAdmin %}
      <a href="/admin/tags"{% if active(d.Path, "/admin/tags") %} class="active"{% endif %}>Tags</a>
      <a href="/admin/domains"{% if active(d.Path, "/admin/domains") %} class="active"{% endif %}>Domains</a>
      <a href="/admin/visits/orphan"{% if active(d.Path, "/admin/visits/orphan") %} class="active"{% endif %}>Orphan visits</a>
      <a href="/admin/api-keys"{% if active(d.Path, "/admin/api-keys") %} class="active"{% endif %}>API keys</a>
      {% if d.WebhooksEnabled %}
      <a href="/admin/webhooks"{% if active(d.Path, "/admin/webhooks") %} class="active"{% endif %}>Webhooks</a>
      {% endif %}
      <a href="/admin/users"{% if active(d.Path, "/admin/users") %} class="active"{% endif %}>Users</a>
      {% endif %}
    </nav>
    <div class="spacer"></div>
    <span class="who">{{ d.User.Username }}</span>
    <form class="inline" method="post" action="/admin/logout">
      <button class="secondary small">Log out</button>
    </form>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
