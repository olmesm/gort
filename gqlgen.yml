schema:
  - internal/web/schema.graphqls
exec:
  filename: internal/web/gql_generated.go
  package: web
  worker_limit: 16
model:
  filename: internal/web/gql_models.go
  package: web
resolver:
  layout: single-file
  filename: internal/web/gql_resolvers.go
  package: web
  type: GraphResolver
  preserve_resolver: true
struct_tag: json
omit_slice_element_pointers: true
models:
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  Long:
    model: github.com/99designs/gqlgen/graphql.Int64
  ShortURL:
    model: github.com/olmesm/gort/internal/web.ShortURLDTO
  ShortURLPage:
    model: github.com/olmesm/gort/internal/web.GraphShortURLPage
  VisitPage:
    model: github.com/olmesm/gort/internal/web.GraphVisitPage
  TagPage:
    model: github.com/olmesm/gort/internal/web.GraphTagPage
  Tag:
    model: github.com/olmesm/gort/internal/web.GraphTag
  Visit:
    model: github.com/olmesm/gort/internal/web.VisitDTO
  Pagination:
    model: github.com/olmesm/gort/internal/web.PaginationDTO
  VisitsSummary:
    model: github.com/olmesm/gort/internal/web.VisitsSummaryDTO
  ShortURLMeta:
    model: github.com/olmesm/gort/internal/web.ShortURLMetaDTO
  RedirectRules:
    model: github.com/olmesm/gort/internal/web.GraphRules
  RedirectRule:
    model: github.com/olmesm/gort/internal/web.GraphRule
  RuleCondition:
    model: github.com/olmesm/gort/internal/web.RuleConditionBody
  Domain:
    model: github.com/olmesm/gort/internal/web.GraphDomain
  DomainRedirects:
    model: github.com/olmesm/gort/internal/web.GraphDomainRedirects
  VisitOverview:
    model: github.com/olmesm/gort/internal/web.VisitOverviewDTO
  DayCount:
    model: github.com/olmesm/gort/internal/web.GraphDay
  BreakdownCount:
    model: github.com/olmesm/gort/internal/web.GraphBreakdown
  APIKey:
    model: github.com/olmesm/gort/internal/web.GraphAPIKey
  Webhook:
    model: github.com/olmesm/gort/internal/web.GraphWebhook
  IDEnabled:
    model: github.com/olmesm/gort/internal/web.IDEnabled
  TagRename:
    model: github.com/olmesm/gort/internal/web.RenameTagBody
  CreateShortURLInput:
    model: github.com/olmesm/gort/internal/web.CreateShortURLBody
  RedirectRuleInput:
    model: github.com/olmesm/gort/internal/web.RuleBody
  RuleConditionInput:
    model: github.com/olmesm/gort/internal/web.RuleConditionBody
  DomainRedirectsInput:
    model: github.com/olmesm/gort/internal/web.DomainRedirectsBody
  CreateAPIKeyInput:
    model: github.com/olmesm/gort/internal/web.CreateAPIKeyBody
  CreateWebhookInput:
    model: github.com/olmesm/gort/internal/web.CreateWebhookBody
