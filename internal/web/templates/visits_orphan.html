{{define "content"}}{{with .Data}}
<h1>Orphan visits</h1>
<p class="muted">Visits to the base URL, inactive or unknown short URLs, and other missing pages.</p>
<div class="toolbar">
  <a class="btn secondary small" href="/admin/visits/orphan">All</a>
  <a class="btn secondary small" href="/admin/visits/orphan?type=base_url">Base URL</a>
  <a class="btn secondary small" href="/admin/visits/orphan?type=invalid_short_url">Invalid short URLs</a>
  <a class="btn secondary small" href="/admin/visits/orphan?type=regular_404">Other 404s</a>
  {{- if .ShowDelete}}
  <form class="inline" method="post" action="/admin/visits/orphan/delete" onsubmit="return confirm('Delete all orphan visits?')">
    <button class="danger small">Delete all orphan visits</button>
  </form>
  {{- end}}
</div>
{{template "analytics" .Analytics}}
{{end}}{{end}}
