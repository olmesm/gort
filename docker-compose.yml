services:
  goto:
    build: .
    ports:
      - "8080:8080"
    environment:
      GOTO_DEFAULT_DOMAIN: "localhost:8080"
      GOTO_INITIAL_ADMIN_USERNAME: "admin"
      # Used only when creating the first admin account.
      GOTO_INITIAL_ADMIN_PASSWORD: "${GOTO_INITIAL_ADMIN_PASSWORD:-}"
      GOTO_DB_CONNECTION: "host=db dbname=goto user=goto password=${GOTO_POSTGRES_PASSWORD:?Set GOTO_POSTGRES_PASSWORD}"
      # GOTO_WEBHOOKS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - goto-data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goto
      POSTGRES_USER: goto
      POSTGRES_PASSWORD: "${GOTO_POSTGRES_PASSWORD:?Set GOTO_POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goto"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - goto-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  goto-data:
  goto-pgdata:
