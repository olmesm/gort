name: goto-e2e
services:
  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_DB: goto
      POSTGRES_USER: goto
      POSTGRES_PASSWORD: goto-local-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goto"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    ports: ["127.0.0.1:8081:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak-smoke/realm.json:/opt/keycloak/data/import/goto-realm.json:ro
