
{% if d.IsAdmin %}
<input type="text" name="group" id="group" aria-describedby="group-help" value="{{ d.Current }}" placeholder="team-a (optional)">
{% else %}
<select name="group" id="group" aria-describedby="group-help">
  <option value="">No group</option>
  {% for item4 in d.Options %}
  <option value="{{ item4 }}"{% if item4 == root.Current %} selected{% endif %}>{{ item4 }}</option>
  {% endfor %}
</select>
{% endif %}

<p class="field-help muted" id="group-help">Groups limit dashboard access to members and admins. Ungrouped short URLs are visible to all signed-in users. Anyone can follow a short URL.</p>
